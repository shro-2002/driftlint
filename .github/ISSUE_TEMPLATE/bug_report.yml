name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: '@sidehustle/cli 1.2.3'
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior (include full error output)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: 'macOS 15 / Node 22.5 / pnpm 10'
    validations:
      required: true
