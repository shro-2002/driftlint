name: Release

# Publishes on a semver tag, e.g. v0.1.0-alpha.0. Prereleases go to the `alpha`
# dist-tag so they never become `latest`. Requires the NPM_TOKEN secret.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      # Prerelease tags (contain a hyphen: -alpha/-beta/-rc) go to the `alpha`
      # channel so they never become `latest`; final tags go to `latest`.
      - name: Select npm dist-tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "dist=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "dist=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (with provenance)
        run: pnpm -r publish --access public --provenance --tag "${DIST_TAG}" --no-git-checks
        env:
          DIST_TAG: ${{ steps.tag.outputs.dist }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
